<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Portal — Corelinks</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Corelinks student learning portal — sign in to access your tutorials and practice.">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .portal-wrap{max-width:460px;margin:0 auto;padding:46px 0 70px}
  .portal-card{background:#fff;border:1px solid #e6ebf3;border-radius:18px;padding:30px;box-shadow:0 18px 50px rgba(15,27,45,.08)}
  .portal-card h1{font-family:'Poppins',sans-serif;font-size:24px;margin:0 0 4px}
  .portal-sub{color:#5b6b82;font-size:14.5px;margin:0 0 20px}
  .pf-row{margin-bottom:14px}
  .pf-row label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px}
  .pf-row input{width:100%;padding:12px 14px;border:1px solid #d7dfea;border-radius:10px;font-size:15px;font-family:inherit}
  .pf-row input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .pf-err{display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
  .pf-btn{width:100%;justify-content:center}
  .portal-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
  .portal-avatar{width:56px;height:56px;border-radius:50%;background:#e8f0fe;color:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;overflow:hidden;flex:none}
  .portal-avatar img{width:100%;height:100%;object-fit:cover}
  .portal-meta .rr{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #eef2f7;font-size:14.5px}
  .portal-meta .rr b{color:#0f1b2d}
  .portal-note{background:#f1f6ff;border:1px solid #d6e4fb;border-radius:12px;padding:16px;color:#1e3a8a;font-size:14px;margin-top:18px}
  .link-btn{background:none;border:none;color:#2563eb;font:inherit;cursor:pointer;padding:0;text-decoration:underline}
  .lesson-body{font-size:15px;line-height:1.65;color:#1f2937}
  .lesson-body h1,.lesson-body h2,.lesson-body h3,.lesson-body h4{font-family:'Poppins',sans-serif;color:#0f1b2d;margin:18px 0 8px}
  .lesson-body pre{background:#0f1b2d;color:#e2e8f0;padding:12px 14px;border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.45}
  .lesson-body code{background:#eef2f7;padding:1px 5px;border-radius:5px;font-size:13px}
  .lesson-body table{border-collapse:collapse;width:100%;margin:10px 0}
  .lesson-body td,.lesson-body th{border:1px solid #e2e8f0;padding:6px 9px;text-align:left;font-size:13.5px}
  .lesson-body img{max-width:100%;height:auto}
  .lesson-body ul,.lesson-body ol{padding-left:22px}
</style>
</head>
<body data-page="portal">
<div id="site-header"></div>

<main>
  <div class="wrap portal-wrap">
    <div id="portalRoot"><div class="portal-card"><p class="portal-sub" style="margin:0">Loading…</p></div></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="courses-data.js"></script>
<script src="blog-data.js"></script>
<script src="app.js"></script>
<script src="portal.js"></script>
</body>
</html>
